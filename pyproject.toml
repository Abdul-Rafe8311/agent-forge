[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "agentforge-coding"
version = "0.1.0"
description = "Lightweight orchestration for AI coding workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Abdul Rafe"}]
dependencies = ["pydantic>=2,<3", "typer>=0.12,<1", "platformdirs>=4,<5", "filelock>=3,<4", "pathspec>=0.12,<1"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Operating System :: OS Independent"]
[project.urls]
Repository = "https://github.com/Abdul-Rafe8311/agent-forge"
Documentation = "https://github.com/Abdul-Rafe8311/agent-forge/tree/main/docs"
[project.optional-dependencies]
openai = ["openai>=2.54,<3"]
anthropic = ["anthropic>=0.125,<1"]
redis = ["redis>=7.4,<8"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
all = ["openai>=2.54,<3", "anthropic>=0.125,<1", "redis>=7.4,<8", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.15,<2", "build>=1,<2", "twine>=7,<8", "httpx>=0.28,<1", "setuptools>=77", "wheel", "openai>=2.54,<3", "anthropic>=0.125,<1", "redis>=7.4,<8", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
[project.scripts]
agentforge = "agentforge.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]
[tool.setuptools.package-data]
agentforge = ["py.typed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
